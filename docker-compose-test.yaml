services:
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data
    restart: unless-stopped
    env_file:
      - .env

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    restart: unless-stopped
    env_file:
      - .env

  paddleocr2_service:
    image: paddleocr2_service
    build:
      target: test
      context: .
      dockerfile: apps/server/business/paddleocr2/Dockerfile
      args:
        - HARBOR_PROXY_URL=${HARBOR_PROXY_URL}
    container_name: paddleocr2_service
    command:
      - uv
      - run
      - pytest
      - -s
      - --cov=./business/
      - --cov=./services
      - --cov-report=term-missing
      - tests/business/
      - tests/services
      - --ignore=tests/business/features
      - -ra -v --maxfail=0
    volumes:
      - ./apps/server/src/:/app/src/
      - ./apps/server/tests/:/app/tests
      - ./apps/server/services/:/app/services/
      - ./apps/server/business/:/app/business/
      - ./apps/server/configs/:/app/configs/
      - test_cache:/app/.cache/paddle/
    environment:
      DEV_MODE: "true"
      CELERY_APP_NAME: default
      PROCESS_NAME: "paddleocr-2.10.0"
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      INSTRUCT_MODEL_NAME: ${INSTRUCT_MODEL_NAME}
      VISION_MODEL: ${VISION_MODEL}
      DATABASE_URL: postgresql://postgres:secret@db:5432/example_db
    depends_on:
      - redis
      - db
      - minio
      - migration
    env_file:
      - .env

  ocr_backend:
    image: ocr_backend
    build:
      target: test
      context: .
      dockerfile: apps/server/ocr_backend/Dockerfile
      args:
        - HARBOR_PROXY_URL=${HARBOR_PROXY_URL}
    container_name: ocr_backend
    command:
      - uv
      - run
      - pytest
      - -s
      - --cov=./ocr_backend
      - --cov=./src
      - --cov-report=term-missing
      - tests/ocr_backend
      - tests/src/
      - -ra -v --maxfail=0
    volumes:
      - ./apps/server/src/:/app/src/
      - ./apps/server/tests/src:/app/tests/src
      - ./apps/server/tests/:/app/tests/
      - ./apps/server/ocr_backend/:/app/ocr_backend/
      - ./apps/server/configs/:/app/configs/
    environment:
      DEV_MODE: "true"
      CELERY_APP_NAME: default
    depends_on:
      - redis
      - db
      - minio
      - migration
    env_file:
      - .env

  migration:
    command:
      - alembic
      - upgrade
      - head
    build:
      target: test
      context: .
      dockerfile: apps/server/ocr_backend/Dockerfile
      args:
        - HARBOR_PROXY_URL=${HARBOR_PROXY_URL}
    container_name: ocr-migration
    volumes:
      - ./apps/server/src/:/app/src/
      - ./apps/server/migration/:/app/migration
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: example_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  minio_data:
    driver: local

  test_cache:
    driver: local

  postgres_data:
    driver: local
