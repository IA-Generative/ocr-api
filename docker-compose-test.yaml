services:
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data
    restart: unless-stopped
    # no env_file referenced

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    restart: unless-stopped
    # no env_file referenced

  paddleocr2_service:
    image: ocr_service
    build:
      context: .
      dockerfile: apps/server/business/paddleocr2/Dockerfile
      target: test
      args:
        HARBOR_PROXY_URL: ${HARBOR_PROXY_URL}
    container_name: ocr_service
    command:
      [
        "uv",
        "run",
        "pytest",
        "-s",
        "--cov=./business/",
        "--cov=./services",
        "--cov-report=term-missing",
        "tests/business",
        "tests/services",
        "--ignore=tests/business/features",
        "-ra",
        "-v",
        "--maxfail=0",
      ]
    volumes:
      - ./apps/server/src/:/app/src/
      - ./apps/server/tests/:/app/tests
      - ./apps/server/services/:/app/services/
      - ./apps/server/business/:/app/business/
      - ./apps/server/configs/:/app/configs/
      - test_cache:/app/models
    environment:
      DEV_MODE: "true"
      CELERY_APP_NAME: default
      PROCESS_NAME: "paddleocr-2.10.0"
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      INSTRUCT_MODEL_NAME: ${INSTRUCT_MODEL_NAME:-gpt-3.5-turbo-instruct}
      VISION_MODEL: ${VISION_MODEL:-gpt-4-vision-preview}
      DATABASE_URL: postgresql://postgres:secret@db:5432/example_db
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_ENDPOINT_URL: http://minio:9000
      S3_BUCKET_NAME: test
      REDIS_HOST: redis
      VERIFY_TOKEN_MODEL: full-access
      WORKER_NAME: "worker.tasks.ocr"
      PADDLE_PDX_CACHE_HOME: /app/models/paddle/
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "true"
      SERVER_BASE_URL: http://api:5000
    depends_on:
      api:
        condition: service_healthy
    # no env_file referenced

  api:
    image: api
    build:
      context: .
      dockerfile: apps/server/ocr_backend/Dockerfile
      target: test
      args:
        HARBOR_PROXY_URL: ${HARBOR_PROXY_URL}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    container_name: api
    ports:
      - 5000:5000
    command:
      [
        "uvicorn",
        "--host",
        "0.0.0.0",
        "--port",
        "5000",
        "ocr_backend.main:app",
        "--reload",
      ]
    environment:
      DEV_MODE: "true"
      CELERY_APP_NAME: default
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_ENDPOINT_URL: http://minio:9000
      S3_BUCKET_NAME: test
      DATABASE_URL: postgresql://postgres:secret@db:5432/example_db
      DATABASE_ASYNC_URL: postgresql+asyncpg://postgres:secret@db:5432/example_db
      REDIS_HOST: redis
      OPENAI_API_KEY: dummy-key-for-tests
      VERIFY_TOKEN_MODEL: full-access

    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
      minio:
        condition: service_started
      migration:
        condition: service_completed_successfully

  ocr_backend:
    image: ocr_backend
    build:
      context: .
      dockerfile: apps/server/ocr_backend/Dockerfile
      target: test
      args:
        HARBOR_PROXY_URL: ${HARBOR_PROXY_URL}
    container_name: ocr_backend
    command:
      - "sh"
      - "-c"
      - "pytest -s --cov=./ocr_backend --cov=./src --cov-report=term-missing tests/ocr_backend/ tests/src/ -ra -v"
    volumes:
      - ./apps/server/src/:/app/src/
      - ./apps/server/tests/src:/app/tests/src
      - ./apps/server/tests/:/app/tests/
      - ./apps/server/ocr_backend/:/app/ocr_backend/
      - ./apps/server/configs/:/app/configs/
    environment:
      DEV_MODE: "true"
      CELERY_APP_NAME: default
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_ENDPOINT_URL: http://minio:9000
      S3_BUCKET_NAME: test
      DATABASE_URL: postgresql://postgres:secret@db:5432/example_db
      DATABASE_ASYNC_URL: postgresql+asyncpg://postgres:secret@db:5432/example_db
      REDIS_HOST: redis
      OPENAI_API_KEY: dummy-key-for-tests
      VERIFY_TOKEN_MODEL: full-access
      API_KEYS: '[{"user_id": "test_user", "email": "test_user@example.com", "roles": ["user"], "is_admin": false, "token": "secret-api"}]'
    depends_on:
      api:
        condition: service_healthy
    # no env_file referenced

  migration:
    image: ocr_backend
    build:
      context: .
      dockerfile: apps/server/ocr_backend/Dockerfile
      target: test
      args:
        HARBOR_PROXY_URL: ${HARBOR_PROXY_URL}
    container_name: ocr-migration
    command: ["alembic", "upgrade", "head"]
    volumes:
      - ./apps/server/src/:/app/src/
      - ./apps/server/migration/:/app/migration
    environment:
      DATABASE_URL: postgresql://postgres:secret@db:5432/example_db
      DATABASE_ASYNC_URL: postgresql+asyncpg://postgres:secret@db:5432/example_db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: example_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  minio_data:
    driver: local

  test_cache:
    driver: local

  postgres_data:
    driver: local
