[project]
name = "ocr-api"
version = "0.1.5"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx==0.25.0",
    "python-json-logger==3.3.0",
    "setuptools==78.1.0",
    "toml>=0.10.2",
    "minio==7.2.15",
    "pydantic-settings==2.8.1",
    "sqlalchemy==2.0.40",
    "celery[redis]>=5.5.1",
]

[dependency-groups]
stress-test = [
    "locust>=2.34.1",
]

test = [
    "httpx>=0.25.0",
    "pytest-asyncio>=0.26.0",
    "pytest==8.3.5",
    "ruff>=0.11.5",
    "pytest-cov>=6.1.1",
]
ocr-backend = [
    "httpx==0.25.0",
    "fastapi==0.111.0",
    "uvicorn==0.16.0",
    "python-multipart==0.0.18",
]
ocr-service = [
    "pdf2image==1.17.0",
    "pillow==10.4.0",
    "psutil>=7.0.0",
    "surya-ocr==0.13.1",
]
version = [
    "commitizen>=4.6.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "semver"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
