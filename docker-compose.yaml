services:
  minio:
    image: minio/minio:latest
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1" ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data
    restart: unless-stopped
    env_file:
      - .env

  redis:
    image: redis:latest
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    ports:
      - "6379:6379"
    restart: unless-stopped
    env_file:
      - .env

  ocr_service:
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: 2.0
          memory: 4000M
        reservations:
          cpus: 2.0
          memory: 4000M
    container_name: ocr-service
    command:
      [
        "celery",
        "-A",
        "services.main",
        "worker",
        "--pool=solo",
        "--loglevel=info",
        "--concurrency=1",
        "-E",
        "--hostname=paddle_worker@%h",
      ]
    image: ocr-service-paddle
    volumes:
      - ./apps/server/src/:/app/src/
      - ./apps/server/tests/:/app/tests
      - ./apps/server/services/:/app/services/
      - ./apps/server/business/:/app/business/
      - models:/app/.cache/paddle/
    build:
      context: .
      dockerfile: apps/server/business/paddleocr2/Dockerfile
    depends_on:
      ocr_backend:
        condition: service_healthy
    environment:
      - PROCESS_NAME=paddleocr-2.10.0
      - WORKER_NAME=worker.tasks.ocr
      - CELERY_APP_NAME=default
      - SERVICE_NAME=ocr_worker
      - ENVIRONMENT=development
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=true
      - SERVER_BASE_URL=http://ocr_backend:5000
      - SERVER_API_KEY=secret-api

    env_file:
      - .env
    develop:
      watch:
        - action: sync
          path: ./apps/server/src
          target: /app/src
        - action: sync
          path: ./apps/server/services
          target: /app/services
        - action: sync
          path: ./apps/server/business
          target: /app/business
        - action: rebuild
          path: ./apps/server/pyproject.toml

  ocr_backend:
    image: ocr-api
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/api/health" ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    build:
      target: test
      context: .
      dockerfile: apps/server/ocr_backend/Dockerfile
    ports:
      - 5000:5000
    container_name: ocr-api
    volumes:
      - ./apps/server/ocr_backend/:/app/ocr_backend/
      - ./apps/server/src/:/app/src/
      - ./apps/server/tests/:/app/tests
      - models:/app/.cache/paddle/
    environment:
      - DEV_MODE="true"
      - PROCESS_NAME=paddleocr-2.10.0
      - WORKER_NAME=worker.tasks.ocr
      - CELERY_APP_NAME=default
      - SERVICE_NAME=ocr_api
      - ENVIRONMENT=development
      - VERIFY_TOKEN_MODEL=api-token
      - |
        API_KEYS=[{"user_id": "test_user", "email": "test_user@example.com", "roles": ["user"], "is_admin": false, "token": "secret-api"}]
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

    env_file:
      - .env
    develop:
      watch:
        - action: sync
          path: ./apps/server/ocr_backend
          target: /app/ocr_backend
        - action: sync
          path: ./apps/server/src
          target: /app/src
        - action: rebuild
          path: ./apps/server/pyproject.toml

  migration:
    image: ocr-api
    command:
      - alembic
      - upgrade
      - head
    build:
      target: test
      context: .
      dockerfile: apps/server/ocr_backend/Dockerfile
    container_name: ocr-migration
    volumes:
      - ./apps/server/src/:/app/src/
      - ./apps/server/migration/:/app/migration
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -p 5432" ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: example_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ocr_frontend:
    container_name: ocr_frontend
    restart: always
    working_dir: /app
    build:
      context: ./apps/client
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env
    environment:
      - VITE_SSO_BYPASS=true
      - VITE_DEV_API_TOKEN=secret-api
    ports:
      - 8081:5173
    volumes:
      - ./apps/client:/app
      - /app/node_modules
    develop:
      watch:
        - action: sync
          path: ./apps/client/src
          target: /app/src
        - action: sync
          path: ./apps/client/public
          target: /app/public
        - action: rebuild
          path: ./apps/client/package.json

volumes:
  minio_data:
    driver: local

  postgres_data:
    driver: local
  models:
    driver: local
