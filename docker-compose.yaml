services:
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data
    restart: unless-stopped
    env_file:
      - .env

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    restart: unless-stopped
    env_file:
      - .env

  # flower_ocr:
  #   image: ocr-flower
  #   environment:
  #     CELERY_BROKER_URL: redis://redis
  #     CELERY_RESULT_BACKEND: db+postgres://db:secret@db:5432/example_db
  #   ports:
  #     - "5555:5555"
  #   command: ["celery", "--broker=$BROKER_URL" , "flower", "--address=0.0.0.0", "--port=5555"]
  #   env_file:
  #     - .env
  #   build:
  #     context: .
  #     dockerfile: apps/server/flower/Dockerfile

  ocr_service:
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: 2.0
          memory: 4000M
        reservations:
          cpus: 2.0
          memory: 4000M
    container_name: ocr-service
    command:
      [
        "celery",
        "-A",
        "services.main",
        "worker",
        "--pool=solo",
        "--loglevel=info",
        "--concurrency=1",
        "-E",
        "--hostname=paddle_worker@%h",
      ]
    image: ocr-service-paddle
    volumes:
      - ./apps/server/src/:/app/src/
      - ./apps/server/tests/:/app/tests
      - ./apps/server/services/:/app/services/
      - ./apps/server/business/:/app/business/
    build:
      context: .
      dockerfile: apps/server/business/paddleocr2/Dockerfile
      # Uncomment to build a GPU-enabled image; also set DEVICE=gpu below and give the
      # container GPU access (e.g. `runtime: nvidia` / `deploy.resources.reservations.devices`).
      # args:
      #   PADDLE_DEVICE: gpu
    depends_on:
      - redis
      - minio
      #- migration
      - db
    environment:
      - PROCESS_NAME=paddleocr-2.10.0
      - WORKER_NAME=worker.tasks.ocr
      - CELERY_APP_NAME=default
      - SERVICE_NAME=ocr_worker
      - ENVIRONMENT=development
      # - DEVICE=gpu # requires the image above to be built with PADDLE_DEVICE=gpu
    env_file:
      - .env

  ocr_backend:
    image: ocr-api
    build:
      target: test
      context: .
      dockerfile: apps/server/ocr_backend/Dockerfile
    ports:
      - 5000:5000
    container_name: ocr-api
    volumes:
      - ./apps/server/ocr_backend/:/app/ocr_backend/
      - ./apps/server/src/:/app/src/
      - ./apps/server/tests/:/app/tests
    environment:
      - DEV_MODE="true"
      - PROCESS_NAME=paddleocr-2.10.0
      - WORKER_NAME=worker.tasks.ocr
      - CELERY_APP_NAME=default
      - SERVICE_NAME=ocr_api
      - ENVIRONMENT=development
    depends_on:
      - redis
      - db
      - minio
      #- migration

    env_file:
      - .env

  ocr_frontend:
    container_name: ocr_frontend
    restart: unless-stopped
    working_dir: /app
    build:
      context: ./apps/client
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env
    environment:
      - VITE_SSO_BYPASS=true
    ports:
      - 8081:3000
    volumes:
      - ./apps/client:/app
      - /app/node_modules
    depends_on:
      - ocr_backend

  migration:
    image: ocr-api
    command:
      - alembic
      - upgrade
      - head
    build:
      target: test
      context: .
      dockerfile: apps/server/ocr_backend/Dockerfile
    container_name: ocr-migration
    volumes:
      - ./apps/server/src/:/app/src/
      - ./apps/server/migration/:/app/migration
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: example_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  minio_data:
    driver: local

  postgres_data:
    driver: local
