services:
  minio:
    image: minio/minio:latest
    container_name: minio_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data
    restart: unless-stopped
    env_file:
      - .env

  redis:
    image: redis:latest
    container_name: redis_dev
    ports:
      - "6379:6379"
    restart: unless-stopped
    env_file:
      - .env

  ocr_service:
    deploy:
      replicas: 1
    command: ["uv", "run", "celery", "-A", "ocr_service.main", "worker", "--pool=threads","--concurrency=4", "-E"]
    image: ocr-service
    volumes:
    - ./example.db:/app/example.db
    - ./ocr_service/:/app/ocr_service/
    - ./src/:/app/src/
    build:
      context: .
      dockerfile: Dockerfiles/ocr_service/Dockerfile
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_QUEUE_NAME: redis-queue
      MINIO_BUCKET_NAME: test
      MINIO_END_POINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      DATABASE_URL: sqlite:///./example.db
    depends_on:
      - redis
      - minio

  ocr_backend:
    command: ["uv", "run", "uvicorn", "ocr_backend.main:app", "--host", "0.0.0.0", "--port", "5000", "--reload"]
    image: ocr-api
    build:
      context: .
      dockerfile: Dockerfiles/ocr_backend/Dockerfile
    ports:
    - 5000:5000
    container_name: ocr-api
    volumes:
    - ./ocr_backend/:/app/ocr_backend/
    - ./example.db:/app/example.db
    - ./src/:/app/src/
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_APP_NAME: default
      MINIO_BUCKET_NAME: test
      MINIO_END_POINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      DATABASE_URL: sqlite:///./example.db
    depends_on:
      - redis
      - minio

volumes:
  minio_data:
    driver: local
