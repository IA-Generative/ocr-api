docker-build-ocr-service-llm:
  variables:
    IMAGE_NAMES: ocr-service-llm:${CI_COMMIT_REF_SLUG} ocr-service-llm:${CI_COMMIT_SHORT_SHA} ocr-service-llm:${CI_COMMIT_TAG}
    DOCKERFILE: "apps/server/business/llm/Dockerfile"
  stage: docker-build
  extends:
    - .kaniko:build-push


docker-build-ocr-flower:
  variables:
    IMAGE_NAMES: ocr-flower:${CI_COMMIT_REF_SLUG} ocr-flower:${CI_COMMIT_SHORT_SHA} ocr-flower:${CI_COMMIT_TAG}
    DOCKERFILE: "apps/server/flower/Dockerfile"
  stage: docker-build
  extends:
    - .kaniko:build-push

docker-build-ocr-frontend:
  variables:
    IMAGE_NAMES: ocr-frontend:${CI_COMMIT_REF_SLUG} ocr-frontend:${CI_COMMIT_SHORT_SHA} ocr-frontend:${CI_COMMIT_TAG}
    DOCKERFILE: "./apps/frontend/Dockerfile"
    WORKING_DIR: "./apps/frontend"
  stage: docker-build
  extends:
    - .kaniko:build-push
