include:
  - project: $CATALOG_PATH
    file: vault-ci.yml
    ref: main
  - project: $CATALOG_PATH
    file: kaniko-ci.yml
    ref: main

default:
  image: alpine:latest

variables:
  TAG: "${CI_COMMIT_REF_SLUG}"
  REGISTRY_URL: "${REGISTRY_HOST}/${PROJECT_PATH}"

stages:
  - read-secret
  - docker-build

read_secret:
  stage: read-secret
  extends:
    - .vault:read_secret

docker-build-ocr-api:
  variables:
    IMAGE_NAMES: ocr-api:${CI_COMMIT_REF_SLUG} ocr-api:${CI_COMMIT_SHORT_SHA} ocr-api:${CI_COMMIT_TAG}
    DOCKERFILE: "apps/server/ocr_backend/Dockerfile"
  stage: docker-build
  extends:
    - .kaniko:build-push

docker-build-ocr-service-paddle-2.10.0:
  variables:
    IMAGE_NAMES: ocr-service-paddle-2.10.0:${CI_COMMIT_REF_SLUG} ocr-service-paddle:${CI_COMMIT_SHORT_SHA} ocr-service-paddle:${CI_COMMIT_TAG}
    DOCKERFILE: "apps/server/business/paddleocr2/Dockerfile"
  stage: docker-build
  extends:
    - .kaniko:build-push

