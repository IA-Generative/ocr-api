include:
  - project: $CATALOG_PATH
    file:
      - vault-ci.yml
      - kaniko-ci.yml
      - helm-ci.yml
    ref: main

default:
  image: alpine:latest

variables:
  TAG: "${CI_COMMIT_REF_SLUG}"
  REGISTRY_URL: "${REGISTRY_HOST}/${PROJECT_PATH}"
  # The chart lives at the repository root (helm/Chart.yaml), not nested under a
  # charts/ parent - so CHARTS_DIR is "." (one level up from the chart itself),
  # same convention as CHARTS_DIR: ./charts pointing at charts/<name>/Chart.yaml
  # elsewhere.
  CHARTS_DIR: .

stages:
  - read-secret
  - docker-build
  - helm-package

read_secret:
  stage: read-secret
  extends:
    - .vault:read_secret

docker-build-ocr-api:
  stage: docker-build
  extends:
    - .kaniko:build-push
  variables:
    DOCKERFILE: "apps/server/ocr_backend/Dockerfile"
    WORKING_DIR: "."
    IMAGE_NAMES: ""  # Overridden in before_script
    EXTRA_BUILD_ARGS: "--build-arg DOCKERHUB_MIRROR_URL=${DOCKERHUB_MIRROR_URL}"
  rules:
    - when: always
  before_script:
    - |
      SHORT_SHA=$(echo $CI_COMMIT_SHA | cut -c1-7)
      TAGS="ocr-api:$SHORT_SHA"
      TAGS="$TAGS ocr-api:$CI_COMMIT_REF_SLUG"
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAG_WITHOUT_V=${CI_COMMIT_TAG#v}
        TAGS="$TAGS ocr-api:$TAG_WITHOUT_V"
        if echo "$CI_COMMIT_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
          TAGS="$TAGS ocr-api:latest"
        fi
      fi
      export IMAGE_NAMES="$TAGS"
      echo "Building with tags: $IMAGE_NAMES"

docker-build-ocr-worker:
  stage: docker-build
  extends:
    - .kaniko:build-push
  variables:
    DOCKERFILE: "apps/server/business/paddleocr2/Dockerfile"
    WORKING_DIR: "."
    IMAGE_NAMES: ""  # Overridden in before_script
    EXTRA_BUILD_ARGS: "--build-arg DOCKERHUB_MIRROR_URL=${DOCKERHUB_MIRROR_URL}"
  rules:
    - when: always
  before_script:
    - |
      SHORT_SHA=$(echo $CI_COMMIT_SHA | cut -c1-7)
      TAGS="ocr-service-paddle-2.10.0:$SHORT_SHA ocr-worker:$SHORT_SHA"
      TAGS="$TAGS ocr-service-paddle-2.10.0:$CI_COMMIT_REF_SLUG ocr-worker:$CI_COMMIT_REF_SLUG"
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAG_WITHOUT_V=${CI_COMMIT_TAG#v}
        TAGS="$TAGS ocr-service-paddle-2.10.0:$TAG_WITHOUT_V ocr-worker:$TAG_WITHOUT_V"
        if echo "$CI_COMMIT_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
          TAGS="$TAGS ocr-service-paddle-2.10.0:latest ocr-worker:latest"
        fi
      fi
      export IMAGE_NAMES="$TAGS"
      echo "Building with tags: $IMAGE_NAMES"

docker-build-ocr-frontend:
  stage: docker-build
  extends:
    - .kaniko:build-push
  variables:
    DOCKERFILE: "./apps/client/Dockerfile"
    WORKING_DIR: "./apps/client"
    IMAGE_NAMES: ""  # Overridden in before_script
    EXTRA_BUILD_ARGS: "--build-arg DOCKERHUB_MIRROR_URL=${DOCKERHUB_MIRROR_URL}"
  rules:
    - when: always
  before_script:
    - |
      SHORT_SHA=$(echo $CI_COMMIT_SHA | cut -c1-7)
      TAGS="ocr-frontend:$SHORT_SHA"
      TAGS="$TAGS ocr-frontend:$CI_COMMIT_REF_SLUG"
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAG_WITHOUT_V=${CI_COMMIT_TAG#v}
        TAGS="$TAGS ocr-frontend:$TAG_WITHOUT_V"
        if echo "$CI_COMMIT_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
          TAGS="$TAGS ocr-frontend:latest"
        fi
      fi
      export IMAGE_NAMES="$TAGS"
      export EXTRA_BUILD_ARGS="${EXTRA_BUILD_ARGS} --build-arg VITE_SENTRY_RELEASE=${SHORT_SHA}"
      echo "Building with tags: $IMAGE_NAMES"

helm-package-push:
  stage: helm-package
  extends:
    - .helm:build-push
  only:
    - tags
    - main
    - dev
  image: alpine/helm:4.1.3