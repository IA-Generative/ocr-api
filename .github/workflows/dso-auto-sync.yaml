name: Trigger dso sync

# Mirrors the pushed branch to the CPiN GitLab instance, which is what actually
# builds the Harbor images the clusters run (`harbor.../mirai/ocr-api` and
# friends, tagged with the branch name: dev, staging, preprod, main).
#
# Deliberately triggered on every branch rather than from cd.yml: the deployed
# tags are branch names, not release versions, so a push to `staging` has to
# reach GitLab whether or not it produced a release. The ghcr.io images built
# by cd.yml are the public, version-tagged mirror of the same code.

on:
  push:
    branches:
    - '**'
  workflow_dispatch:

# One pipeline per branch on the GitLab side; a second trigger for the same
# branch would race the first. Superseded runs are safe to drop here - the
# newest push carries everything the older one did.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    uses: dnum-mi/fabnum-cicd/.github/workflows/sync-cpin.yml@v0
    # Posts to the GitLab mirror API and touches nothing on GitHub.
    permissions: {}
    with:
      # A repository VARIABLE, not a secret. `secrets` is not one of the
      # contexts GitHub allows in a reusable workflow's `with:` block, and
      # routing it through a job output does not help either - outputs holding
      # a secret are redacted on the runner and never reach the caller. The
      # previous ArnaudTA/actions implementation took it as a secret, so this
      # value has to be re-created under Settings > Variables before the first
      # run. It is a public base URL, not a credential; the trigger token is
      # the secret, and it stays one below.
      GITLAB_URL: ${{ vars.GITLAB_URL }}
      # Named GITLAB_MIRROR_ID / GILTAB_PROJECT_NAME in this repository's
      # variables, from the previous ArnaudTA/actions implementation.
      GIT_MIRROR_PROJECT_ID: ${{ vars.GITLAB_MIRROR_ID }}
      REPOSITORY_NAME: ${{ vars.GILTAB_PROJECT_NAME }}
      BRANCH_TO_SYNC: ${{ github.ref_name }}
      SYNC_ALL: false
    secrets:
      GIT_MIRROR_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
