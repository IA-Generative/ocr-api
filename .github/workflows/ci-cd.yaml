name: CI/CD Workflow

on:
  push:
    branches:
      - '**'  # Pour chaque push sur n'importe quelle branche
    paths:
      - '**/*.py'
      - 'Dockerfile'
      - 'Makefile'
      - 'deployment.yaml'
  pull_request:
    branches:
      - staging  # Cette action s'exécute sur des PR vers 'staging'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  K8S_NAMESPACE: mirai-ocr

jobs:
  # Lancer les tests sur chaque push
  run-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.x

      - name: Install dependencies and run tests
        run: |
          make tests

  # Build et Push de l'image seulement sur la branche staging
  build-and-push:
    runs-on: ubuntu-latest
    needs: run-tests
    if: github.ref == 'refs/heads/staging'  # Exécuter seulement sur 'staging'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Docker for GHCR login
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        run: |
          make docker-build-push


  version-bump:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/staging'  
    permissions:
      contents: write  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.x

      - name: Install Commitizen and standard-version
        run: |
          make bump-patch
          
      - name: Push version bump and tags
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git push --follow-tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Utilise le token pour autoriser les pushs

