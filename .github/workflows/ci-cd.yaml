name: CI/CD Workflow

on:
  push:
    branches:
      - '**'

jobs:
  build-and-push:
    runs-on: actions-runner-controller
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Build and Push Docker image
        run: |
          make build

  run-tests-backend:
    runs-on: actions-runner-controller
    needs: build-and-push
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.x

      - name: Install dependencies and run tests
        run: |
          make test-backend-api



  run-tests-service-checkbox:
    runs-on: actions-runner-controller
    needs: build-and-push
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.x

      - name: Install dependencies and run tests
        run: |
          make test-services-checkbox

  run-tests-service-paddle:
    runs-on: actions-runner-controller
    needs: build-and-push
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.x

      - name: Install dependencies and run tests
        run: |
          make test-services-paddleocr2.10.0
