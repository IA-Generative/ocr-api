name: CI/CD Workflow

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - staging  # Cette action s'exécute sur des PR vers 'staging'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Lancer les tests sur chaque push
  run-tests:
    runs-on: actions-runner-controller
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.x

      - name: Install dependencies and run tests
        run: |
          make tests-docling

      - name: Stop docker container
        run: |
          make down

  # Build et Push de l'image seulement sur la branche staging
  build-and-push:
    runs-on: actions-runner-controller
    needs: run-tests
    if: github.ref == 'refs/heads/staging'  # Exécuter seulement sur 'staging'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Docker for GHCR login
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        run: |
          make docker-build
