name: Python Release

on:
  push:
    branches:
      - develop
      - preprod
      - prod

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        
      - name: Set Git Config
        run: |
            git config --global user.name "GitHub Actions"
            git config --global user.email "actions@github.com"
            

      # Étape 2 : Installer uv
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Étape 3 : Installer Python (via uv)
      - name: Install Python
        run: uv python install 3.11

      # Étape 4 : Synchroniser les dépendances
      - name: Sync dependencies
        run: uv sync --group version

      # Étape 5 : Générer la version et le changelog avec Commitizen
      - name: Run Commitizen bump
        run: |
          uv run cz bump --changelog --yes

      # Étape 6 : Pousser les modifications et les tags
      - name: Push changes
        run: |
          git add pyproject.toml CHANGELOG.md
          git commit -m "chore(release): bump version"
          git push
          git push --tags

      # Étape 7 : Créer une release GitHub
      - name: Create Release on GitHub
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
