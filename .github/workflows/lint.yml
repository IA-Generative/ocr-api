name: Lint

# Kept local rather than delegated to fabnum-cicd: the shared catalogue has no
# Python linter, and this one is a thin wrapper around the repository's own
# `make lint` (ruff for apps/server, ESLint for apps/client and the root files).

on:
  workflow_call:
    inputs:
      PYTHON_VERSION:
        description: Python version used to run the linter
        required: false
        type: string
        default: "3.13"
      NODE_VERSION:
        description: Node version used to run the frontend linter
        required: false
        type: string
        default: "22"
  workflow_dispatch:
    inputs:
      PYTHON_VERSION:
        description: Python version used to run the linter
        required: false
        type: string
        default: "3.13"
      NODE_VERSION:
        description: Node version used to run the frontend linter
        required: false
        type: string
        default: "22"

jobs:
  lint:
    name: Lint code
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

    - name: Set up uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      with:
        python-version: ${{ inputs.PYTHON_VERSION }}
        enable-cache: true
        cache-dependency-glob: apps/server/uv.lock

    - name: Set up pnpm
      uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0

    - name: Set up Node
      uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903  # v6.0.0
      with:
        node-version: ${{ inputs.NODE_VERSION }}
        cache: pnpm
        cache-dependency-path: |
          pnpm-lock.yaml
          apps/client/pnpm-lock.yaml

    - name: Install Node dependencies
      # `make lint` shells out to ESLint at the root and in apps/client, which
      # keep separate installs (apps/client is not a pnpm workspace member).
      run: |
        pnpm install --frozen-lockfile
        pnpm --dir apps/client install --frozen-lockfile

    - name: Run lint
      # `make lint` bootstraps uv itself when absent, so it is safe whichever
      # runner this lands on.
      run: make lint
