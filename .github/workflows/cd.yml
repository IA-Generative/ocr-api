name: CD

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  expose-vars:
    runs-on: ubuntu-24.04
    steps:
      - name: Exposing env vars
        run: echo "Exposing env vars"

  release:
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      pull-requests: write
      packages: write
