name: Release Management

on:
  push:
    branches:
      - feature/refacto
      - feature/build

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 
        uses: actions/checkout@v4
        with:
            fetch-depth: 0
            fetch-tags: true

      - name: Run Release Please
        uses: googleapis/release-please-action@v4
        with:
          release-type: python
          prerelease: ${{ github.ref == 'refs/heads/feature/build' || github.ref == 'refs/heads/preprod' }}
          default-branch: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
