services:
  openapi_generator:
    image: openapitools/openapi-generator-cli:latest
    volumes:
      - ./frontend:/local
    working_dir: /local
    command: >
      generate
      -i ${VITE_OCR_API_URL}/openapi.json
      -g typescript-axios
      -o /local/src/api/types
      --additional-properties=supportsES6=true,typescriptThreePlus=true,npmName=ocr-api-client
    env_file:
      - .env

  ocr_frontend:
    container_name: ocr_frontend
    restart: always
    working_dir: /app
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env
    ports:
      - 8081:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - openapi_generator