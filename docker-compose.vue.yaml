services:
  mirai_frontend:
    container_name: ocr_frontend
    restart: always
    working_dir: /app
    build:
      context: .
      dockerfile: Dockerfiles/frontend/Dockerfile
      target: dev
    image: ocr/front:dev
    # env_file:
    #   - .env
    environment:
      - NODE_ENV=development
      - FRONT_PORT=3000
      - VITE_OCR_API_URL=https://mirai-ocr-dev.mirai-hp.cpin.numerique-interieur.com
    ports:
    - 8081:3000
    volumes:
    - ./frontend:/app
    - /app/node_modules
    # attach: true