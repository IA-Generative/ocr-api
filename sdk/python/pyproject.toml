[project]
name = "ocr-sdk"
version = "0.20.0-rc.12"
description = "Python SDK for OCR API - Supports both async and sync clients"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.11.5",
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "boto3>=1.43.79",
    "celery>=5.6.2",
    "cryptography>=50.0.0",
    "hvac>=2.4.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=7.0.0",
    "python-json-logger>=4.2.0",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "ruff>=0.16.4",
    "sqlalchemy>=2.0.52",
    "toml>=0.10.2",
]
