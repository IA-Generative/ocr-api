[project]
name = "ocr-api"

version = "1.11.1"

description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "python-json-logger==3.3.0",
    "setuptools>=80.9.0",
    "toml>=0.10.2",
    "minio>=7.2.16",
    "pydantic-settings>=2.10.1",
    "sqlalchemy>=2.0.42",
    "celery[redis]>=5.6.3",
    "flower>=2.0.1",
    "psycopg2-binary>=2.9.10",
    "boto3>=1.40.0",
    "qdrant-client>=1.15.1",
    "aiofiles>=24.1.0",
    "pymupdf>=1.26.3",
    "openai>=2.30.0",
    "pydantic>=2.13.0",
    "loguru>=0.7.3",
    "fastapi>=0.135.3",
    "instructor>=1.15.1",
    "aioboto3>=15.5.0",
]

[dependency-groups]
stress-test = [
    "locust>=2.34.1",
]

test = [
    "httpx>=0.25.0",
    "pytest-asyncio>=1.3.0",
    "pytest==9.0.2",
    "ruff>=0.15.9",
    "pytest-cov>=7.1.0",
    # "celery[pytest]>=5.5.1",
    "pillow>=12.2.0",
    "requests>=2.33.1",
    "coverage>=7.13.5",
    "datasets>=4.8.4",
    "aiosqlite>=0.22.1",
]
ocr-backend = [
    "httpx>=0.25.0",
    "uvicorn[standard]==0.42.0",
    "python-multipart==0.0.22",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "python-keycloak>=7.1.1",
    "sqlalchemy[asyncio]>=2.0.49",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
]

ocr-service-paddle = [
    "opencv-python-headless>=4.13.0.92",
    # "paddleocr==2.10.0",
    # "paddlepaddle==3.0.0",
    "paddleocr>=3.3.0",
    "paddlepaddle==3.1.1",
    "pdf2image==1.17.0",
    "pillow==12.2.0",
    "psutil>=7.2.2",
    "pynvml>=13.0.1",
]

ocr-service-paddle-gpu = [
    "opencv-python-headless>=4.11.0.86",
    "pdf2image==1.17.0",
    "pillow==12.2.0",
    "psutil>=7.0.0",
    "pynvml>=13.0.1",
]

services = [
    "docx2txt>=0.9",
    "langchain-community>=0.4",
    "langfuse>=3.5.1",
    "odfpy>=1.4.1",
    "opencv-python-headless>=4.11.0.86",
    "pdf2image==1.17.0",
    "pillow==12.2.0",
    "psutil>=7.0.0",
    "pynvml>=13.0.1",
    "pypandoc-binary>=1.17",
    "unstructured>=0.18.15",
]

migration = [
    "alembic>=1.18.4"
]

dev = [
    "ipykernel>=6.29.5",
    "pre-commit>=4.2.0",
    "ruff>=0.12.3",
]

version = [
    "commitizen>=4.6.0",
]
client = [
    "python-magic>=0.4.27",
]
checkbox_service = [
    "boxdetect>=1.0.2",
]
llm = [
    "instructor>=1.15.1",
    
]
business-forms = [
    "pillow>=12.2.0",
    "pydantic>=2.11.7",
    "pymupdf>=1.26.3",
]
ocr-service-features = [
    "clip",
    "efficientnet-pytorch>=0.7.1",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "transformers>=4.55.2",
]

training = [
    "albumentations>=2.0.8",
    "jiwer>=4.0.0",
    "lmdb>=2.2.0",
    "rapidfuzz>=3.13.0",
    "scikit-image>=0.26.0",
]
templating = [
    "odfpy>=1.4.1",
    "relatorio>=0.12.1",
]


[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "semver"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true



[tool.ruff]
line-length = 120
exclude = [
    "apps/server/training/datasets/datasets/",
    "apps/server/training/data/",
    "apps/server/data/",
    "apps/server/training/output/",
    "apps/server/tests/data/valid/test.csv",
    "PaddleOCR",
    "apps/server/PaddleOCR",
    ".venv",
]


[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]
clip = { git = "https://github.com/openai/CLIP.git" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true


[tool.ty.rules]
# Activer toutes les règles en erreur par défaut
possibly-unresolved-reference = "error"
unresolved-import = "warn"
invalid-return-type = "error"
division-by-zero = "error"
call-non-callable = "error"
undefined-reveal = "warn"

[tool.ty.src]
exclude = [
    "tests/",
    "migration/",
    ".venv/",
    "benchmark/",
    "stress-script/",
]

[tool.ty.analysis]
# Traiter les imports non résolus de libs tierces comme Any pour réduire le bruit
allowed-unresolved-imports = [
    "paddle.**",
    "paddleocr.**",
    "cv2.**",
    "pdf2image.**",
    "langfuse.**",
    "langchain.**",
    "langchain_community.**",
    "unstructured.**",
    "docx2txt.**",
    "odfpy.**",
    "pypandoc.**",
    "flower.**",
    "locust.**",
    "boxdetect.**",
    "instructor.**",
    "docling.**",
    "pynvml.**",
    "PIL.**",
]
