[project]
name = "ocr-api"

version = "0.12.1"

description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "python-json-logger>=4.1.0",
    "setuptools>=82.0.1",
    "toml>=0.10.2",
    "minio>=7.2.20",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "celery[redis]>=5.6.3",
    "flower>=2.0.1",
    "psycopg2-binary>=2.9.10",
    "boto3>=1.43.37",
    "qdrant-client>=1.18.0",
    "aiofiles>=25.1.0",
    "pymupdf>=1.28.0",
    "cryptography>=48.0.1",
]

[dependency-groups]
stress-test = [
    "locust>=2.44.4",
]

test = [
    "httpx>=0.25.0",
    "pytest-asyncio>=1.4.0",
    "pytest==9.1.1",
    "ruff>=0.15.20",
    "pytest-cov>=7.1.0",
    # "celery[pytest]>=5.5.1",
    "pillow>=12.2.0",
    "requests>=2.34.2",
    "coverage>=7.8.0",
    "datasets>=5.0.0",
    "pytest-dotenv>=0.5.2",
]
ocr-backend = [
    "httpx>=0.25.0",
    "fastapi>=0.116.1",
    "uvicorn[standard]==0.49.0",
    "python-multipart==0.0.32",
    "prometheus-fastapi-instrumentator>=8.0.2",
    "python-keycloak>=7.1.1",
    "sentry-sdk[fastapi]>=2.64.0",
]

ocr-service-paddle = [
    "opencv-python-headless>=4.13.0.92",
    "paddleocr==3.7.0",
    "paddlepaddle==3.3.1",
    "paddlex[ocr]==3.7.2",
    "pdf2image==1.17.0",
    "pillow>=12.2.0",
    "psutil>=7.2.2",
    "pynvml>=13.0.1",
]



services = [
    "docx2txt>=0.9",
    "langchain-community>=0.4.2",
    "langfuse>=4.12.0",
    "odfpy>=1.4.1",
    "opencv-python-headless>=4.13.0.92",
    "pdf2image==1.17.0",
    "pillow>=12.2.0",
    "psutil>=7.0.0",
    "pynvml>=13.0.1",
    "pypandoc-binary>=1.17",
    "unstructured>=0.23.1",
    "sentry-sdk[celery]>=2.34.1",
]

migration = [
    "alembic>=1.18.5"
]

dev = [
    "httpx>=0.25.0",
    "pytest-asyncio>=1.4.0",
    "pytest==9.1.1",
    "ruff>=0.15.20",
    "pytest-cov>=7.1.0",
    # "celery[pytest]>=5.5.1",
    "pillow>=12.2.0",
    "requests>=2.32.3",
    "coverage>=7.8.0",
    "datasets>=5.0.0",
    "pytest-dotenv>=0.5.2",
]

version = [
    "commitizen>=4.16.4",
]
client = [
    "python-magic>=0.4.27",
]
checkbox_service = [
    "boxdetect>=1.0.2",
]
llm = [
    "instructor>=1.15.4",
    "openai>=2.44.0",
    "pydantic>=2.13.4",
]
business-forms = [
    "pillow>=12.2.0",
    "pydantic>=2.11.7",
    "pymupdf>=1.26.3",
]
ocr-service-features = [
    "efficientnet-pytorch>=0.7.1",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "transformers>=5.0.0rc3",
]
ocr-docling = [
    "docling>=2.107.0",
]


[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "semver"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true



[tool.pytest.ini_options]
env_override_existing_values = 1
env_files = ["tests/.env.testing"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120


[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
