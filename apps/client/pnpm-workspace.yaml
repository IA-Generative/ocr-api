# Packages published within the last 24h are not resolved (pnpm's default), and
# `strict` stops pnpm from silently granting itself an exemption when it hits
# one — a human reviews it and adds it below instead.
minimumReleaseAgeStrict: true

# Vue 3.5.42 and @types/node 26.4.0 were published the same morning this branch
# was cut, so the 24h quarantine had not elapsed yet. Both come from their
# official orgs and were reviewed. Drop this block once they have aged out:
#   pnpm pm clean --lockfile && pnpm install
minimumReleaseAgeExclude:
  - '@types/node@26.4.0'
  - '@vue/compiler-core@3.5.42'
  - '@vue/compiler-dom@3.5.42'
  - '@vue/compiler-sfc@3.5.42'
  - '@vue/compiler-ssr@3.5.42'
  - '@vue/reactivity@3.5.42'
  - '@vue/runtime-core@3.5.42'
  - '@vue/runtime-dom@3.5.42'
  - '@vue/server-renderer@3.5.42'
  - '@vue/shared@3.5.42'
  - vue@3.5.42

shellEmulator: true

trustPolicy: no-downgrade

# Long-standing transitive packages that predate npm provenance, so a newer
# signed release makes them look like a downgrade. Both were reviewed by hand.
trustPolicyExclude:
  # Babel's semver dependency, pinned at 6.x since 2023, reached through
  # vite-plugin-vue-devtools.
  - semver
  # workbox-build's maintained fork of @surma/rollup-plugin-off-main-thread.
  - '@trickfilm400/rollup-plugin-off-main-thread'

overrides:
  # Transitive, security-only bumps (Dependabot); no direct dependency needs pinning.
  brace-expansion@1: '>=1.1.16'
  brace-expansion@2: '>=2.1.2'
  browserslist: '>=4.28.7'
  fast-uri: '>=3.1.6'
  form-data: '>=4.0.6'
  js-yaml: '>=4.3.1'
  nanoid: '>=3.3.18'
  postcss: '>=8.5.23'
  serialize-javascript: '>=7.0.5'

# pnpm 11 merges onlyBuiltDependencies / ignoredBuiltDependencies into a single
# allow-list: true runs the package's install scripts, false skips them.
allowBuilds:
  # `preinstall` guard script; nothing the Vite build needs.
  '@gouvfr/dsfr': false
  '@tailwindcss/oxide': true
  esbuild: true
  unrs-resolver: true
  vue-demi: false
