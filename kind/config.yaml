kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 80
    hostPort: 8080
  - containerPort: 443
    hostPort: 8443
  extraMounts:
  #- hostPath: /app
  #  containerPath: /app
  - containerPath: /var/lib/kubelet/config.json
    hostPath: /home/debian/.docker/config.json
